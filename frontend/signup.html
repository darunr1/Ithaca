<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get started · Ithaca</title><link rel="stylesheet" href="/landing.css"></head><body class="auth-body"><a class="auth-brand" href="/"><span>Ι</span><strong>ITHACA<small>WHERE LEGACIES LIVE ON</small></strong></a><main class="auth-shell"><section><p class="landing-kicker">BEGIN YOUR RECORD</p><h1>Give your engineering work a future.</h1><p>Create a secure account, verify your email, then complete a short Ithaca profile.</p></section><div class="auth-card"><form id="auth-form" class="auth-form"><h2>Create account</h2><label for="name">Full name</label><input id="name" name="name" autocomplete="name" minlength="2" maxlength="160" required><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><button type="submit">Create account</button><p id="auth-status" role="status"></p><p class="auth-links"><a href="/login">Already have an account?</a></p></form></div></main><script type="module" src="/auth-page.js"></script></body></html>
